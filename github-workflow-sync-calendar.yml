# COPY THIS FILE TO: .github/workflows/sync-calendar.yml in your repo
# Then: GitHub repo > Settings > Secrets and variables > Actions > add:
# GOOGLE_SERVICE_ACCOUNT_JSON, CALENDAR_ID, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: Sync GRIT Calendar to Supabase
on:
  schedule: [ { cron: "*/30 * * * *" } ]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync-calendar.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
